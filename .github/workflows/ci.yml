name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs once the repository is public, where hosted runners are free.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            features: --all-features
          - name: linux release set
            features: --no-default-features --features bm25,vec,openai,rerank,wasm,http
          - name: no features
            features: --no-default-features
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test ${{ matrix.features }}
