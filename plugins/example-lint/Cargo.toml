[package]
name = "kiwi-example-lint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Example Kiwi WebAssembly plugin: flags TODO markers and empty sections"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.51.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
