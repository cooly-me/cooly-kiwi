# Baseline of the `catalogue` suite (bench/run.sh): 10,000 one-record documents from
# bench/catalogue.py (seed 7, 200 questions) with the `hash` embedder. Quality is
# deterministic; timings were measured on an AMD Ryzen 5 5600G (6 cores, 12 threads),
# Ubuntu 22.04, with a release build of the Linux feature set, and are loose on
# purpose. Update the figures in the pull request of a change that moves them on
# purpose.

[tolerance]
quality = 0.01
latency = 5.0
latency_floor_ms = 5.0

[modes.bm25]
recall_at_5 = 0.543
recall_at_10 = 0.576
mrr = 0.752
p95_ms = 0.199

[modes."bm25+vec"]
recall_at_5 = 0.364
recall_at_10 = 0.531
mrr = 0.491
p95_ms = 0.473

[timings]
full_build_ms = 2036
reload_ms = 9.62
cold_start_ms = 8.40
